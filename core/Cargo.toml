[package]
name = "softjaw-core"
version = "0.1.0"
edition = "2021"
description = "Soft jaw generator: mesh -> SDF grid -> swept pocket -> jaw halves -> STL"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
